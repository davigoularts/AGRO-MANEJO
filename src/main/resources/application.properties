spring.datasource.url=jdbc:postgresql://localhost:5437/projeto
spring.datasource.username=projeto
spring.datasource.password=projeto
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- Swagger (Aula 09)
# Endereço do contrato OpenAPI em JSON -- é este arquivo que o Postman importa.
springdoc.api-docs.path=/v3/api-docs
# Endereço da página do Swagger UI (redireciona para /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
# Sem esta linha, o Swagger mostra as respostas como "*/*"; a API só devolve JSON.
springdoc.default-produces-media-type=application/json
# Abre cada endpoint já no modo "Try it out", pronto para enviar a requisição.
springdoc.swagger-ui.try-it-out-enabled=true
# Ordena os grupos (tags) e, dentro deles, os endpoints pelo método HTTP.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
